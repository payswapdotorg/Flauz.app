name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  licenses:
    name: Third-party licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Validate release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          CARGO_PKG_VERSION="$(cargo metadata --locked --manifest-path crates/codex-app/Cargo.toml --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "codex-app") | .version')"
          test -n "${CARGO_PKG_VERSION}"
          test "${GITHUB_REF_NAME}" = "v${CARGO_PKG_VERSION}"

      - name: Install cargo-about
        run: cargo install --locked --features cli --version 0.9.1 cargo-about

      - name: Generate license inventory
        run: cargo about generate --locked about.hbs --output-file THIRD_PARTY_LICENSES.html

      - uses: actions/upload-artifact@v7
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.html
          if-no-files-found: error
          retention-days: 7

  build:
    name: Package ${{ matrix.label }}
    needs: licenses
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
          - os: ubuntu-24.04
            label: linux-x86_64
    env:
      PACKAGE_LABEL: ${{ github.ref_type == 'tag' && github.ref_name || format('snapshot-{0}', github.run_number) }}

    steps:
      - uses: actions/checkout@v7

      - name: Add Windows shader compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter fxc.exe -Recurse |
            Where-Object FullName -Match '\\x64\\fxc\.exe$' |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $fxc) {
            throw "Windows SDK fxc.exe was not found"
          }
          "GPUI_FXC_PATH=$($fxc.FullName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang \
            libclang-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            mesa-vulkan-drivers \
            pkg-config \
            xauth \
            xvfb

      - uses: actions/download-artifact@v8
        with:
          name: third-party-licenses

      - name: Dependency policy
        run: python scripts/check_dependency_policy.py

      - name: Format
        run: cargo fmt --all --check

      - name: Patched Markdown renderer
        run: |
          rustfmt --edition 2024 --check third_party/gpui-component/src/text/text_view.rs third_party/gpui-component/src/text/node.rs third_party/gpui-component/src/text/format/markdown.rs
          cargo clippy --locked --manifest-path third_party/gpui-component/Cargo.toml --target-dir target --lib -- -D warnings
          cargo test --locked --manifest-path third_party/gpui-component/Cargo.toml --target-dir target source_highlights_preserve_nested_markdown_marks

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      - name: Release build
        run: cargo build --locked --release -p codex-app

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "codexrs-$env:PACKAGE_LABEL-windows-x86_64"
          $root = Join-Path dist $name
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $root "docs/assets") -Force | Out-Null
          Copy-Item target/release/codexrs.exe $root
          Copy-Item target/release/codex-computer-use-overlay.exe $root
          Copy-Item README.md,README.ru.md,README.zh-CN.md,LICENSE,CHANGELOG.md,CONTRIBUTING.md,AGENTS.md,ROADMAP.md,SUPPORT.md,SECURITY.md,CODE_OF_CONDUCT.md,THIRD_PARTY_LICENSES.html $root
          Copy-Item docs/architecture.md,docs/parity-matrix.md,docs/platform-support.md,docs/prior-art.md (Join-Path $root "docs")
          Copy-Item docs/assets/codexrs-hero-v2.png (Join-Path $root "docs/assets")
          Compress-Archive -Path $root -DestinationPath "dist/$name.zip"

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          name="codexrs-${PACKAGE_LABEL}-linux-x86_64"
          root="dist/${name}"
          mkdir -p "${root}/docs/assets"
          install -m 0755 target/release/codexrs "${root}/codexrs"
          cp README.md README.ru.md README.zh-CN.md LICENSE CHANGELOG.md CONTRIBUTING.md AGENTS.md ROADMAP.md SUPPORT.md SECURITY.md CODE_OF_CONDUCT.md THIRD_PARTY_LICENSES.html "${root}/"
          cp docs/architecture.md docs/parity-matrix.md docs/platform-support.md docs/prior-art.md "${root}/docs/"
          cp docs/assets/codexrs-hero-v2.png "${root}/docs/assets/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"

      - name: Linux archive desktop startup smoke
        if: runner.os == 'Linux'
        shell: bash
        env:
          WAYLAND_DISPLAY: codexrs-ci-no-socket
          ZED_HEADLESS: "1"
        run: |
          set -euo pipefail
          name="codexrs-${PACKAGE_LABEL}-linux-x86_64"
          smoke_root="$(mktemp -d)"
          trap 'rm -rf -- "$smoke_root"' EXIT
          tar -xzf "dist/${name}.tar.gz" -C "$smoke_root"
          bash scripts/linux_desktop_smoke.sh "$smoke_root/${name}/codexrs"

      - name: Windows archive desktop startup smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "codexrs-$env:PACKAGE_LABEL-windows-x86_64"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "codexrs-archive-smoke-$([guid]::NewGuid().ToString('N'))"
          try {
            Expand-Archive -LiteralPath "dist/$name.zip" -DestinationPath $smokeRoot
            $archiveRoot = Join-Path $smokeRoot $name
            $binary = Join-Path $archiveRoot 'codexrs.exe'
            $overlay = Join-Path $archiveRoot 'codex-computer-use-overlay.exe'
            if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
              throw "Windows archive is missing codexrs.exe"
            }
            if (-not (Test-Path -LiteralPath $overlay -PathType Leaf)) {
              throw "Windows archive is missing codex-computer-use-overlay.exe"
            }
            & scripts/windows_desktop_smoke.ps1 -Binary $binary
          }
          finally {
            if (Test-Path -LiteralPath $smokeRoot) {
              Remove-Item -LiteralPath $smokeRoot -Recurse -Force
            }
          }

      - name: Install the pinned Codex CLI for the FV journey smoke
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: npm install --global @openai/codex@0.146.0-alpha.3.1

      - name: Windows FV journey smoke (FV-002 harness)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 25
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'fv-windows-evidence'
          & scripts/windows_fv_smoke.ps1 -Binary target/release/codexrs.exe -EvidenceRoot $root

      - name: Upload FV Windows journey-smoke evidence
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: fv-windows-journey-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/fv-windows-evidence
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: codexrs-${{ matrix.label }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: codexrs-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.zip ./*.tar.gz > SHA256SUMS.txt

      - name: Validate checksum manifest coverage (REL-001)
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # REL-001: the checksum manifest must cover every packaged archive
          # (one SHA256SUMS entry per artifact). GNU sha256sum writes
          # "<64-hex>" + a two-character separator (two spaces in text mode,
          # space + "*" in binary mode) + the name, so the name starts at
          # column 67.
          shopt -s nullglob
          archives=(./*.zip ./*.tar.gz)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "::error::[REL-001] no packaged archives found in dist/ — refusing to publish an empty checksum manifest" >&2
            exit 1
          fi
          expected="$(printf '%s\n' "${archives[@]#./}" | sort)"
          covered="$(cut -c 67- SHA256SUMS.txt | sed -e 's|^\./||' -e '/^$/d' | sort)"
          if [[ "${expected}" != "${covered}" ]]; then
            echo "::error::[REL-001] SHA256SUMS.txt does not cover every packaged artifact (expected < vs > covered):" >&2
            diff <(printf '%s\n' "${expected}") <(printf '%s\n' "${covered}") >&2 || true
            exit 1
          fi
          echo "[REL-001] checksum manifest covers every packaged artifact: ${archives[*]}"

      - name: Sign release checksums (GPG-ready, REL-001)
        shell: bash
        env:
          FLAUZ_RELEASE_SIGNING_KEY: ${{ secrets.FLAUZ_RELEASE_SIGNING_KEY }}
          FLAUZ_RELEASE_SIGNING_KEY_PASSPHRASE: ${{ secrets.FLAUZ_RELEASE_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd dist
          # REL-001: the GPG-ready detached-signature step. Honest bound: no
          # signing key exists in this environment, so the detached signature
          # is SKIPPED with a NAMED log line — never a faked signature, never
          # a failed build. Recovery path: the operator provisions the
          # FLAUZ_RELEASE_SIGNING_KEY repository secret (an ASCII-armored
          # OpenPGP private key; optional FLAUZ_RELEASE_SIGNING_KEY_PASSPHRASE
          # for its passphrase) and re-runs this release workflow.
          if [[ -z "${FLAUZ_RELEASE_SIGNING_KEY:-}" ]]; then
            echo "[REL-001] SIGNING-SKIPPED: the release signing key secret FLAUZ_RELEASE_SIGNING_KEY is absent in this environment — no detached signature is produced (none is faked; the build is not failed). The published SHA256SUMS.txt remains the integrity oracle for every archive. Recovery path: the operator provisions the FLAUZ_RELEASE_SIGNING_KEY secret and re-runs this release workflow."
            echo "::warning::[REL-001] signing key absent — detached signature skipped (named gap; see docs/platform-support.md, Linux distribution strategy)"
            exit 0
          fi
          command -v gpg >/dev/null 2>&1 || {
            echo "::error::[REL-001] FLAUZ_RELEASE_SIGNING_KEY is configured but gpg is not installed on the runner — cannot produce the detached signature" >&2
            exit 1
          }
          signing_home="$(mktemp -d)"
          cleanup() { rm -rf -- "${signing_home}"; }
          trap cleanup EXIT
          # The credential law: key material is piped in through stdin and is
          # never echoed to the log.
          if ! printf '%s' "${FLAUZ_RELEASE_SIGNING_KEY}" | gpg --homedir "${signing_home}" --batch --quiet --import 2>/dev/null; then
            echo "::error::[REL-001] gpg failed to import FLAUZ_RELEASE_SIGNING_KEY — is the secret an ASCII-armored OpenPGP private key?" >&2
            exit 1
          fi
          key_id="$(gpg --homedir "${signing_home}" --batch --quiet --list-secret-keys --with-colons 2>/dev/null | awk -F: '$1 == "fpr" {print $10; exit}' || true)"
          if [[ -z "${key_id}" ]]; then
            echo "::error::[REL-001] no OpenPGP secret key found inside FLAUZ_RELEASE_SIGNING_KEY" >&2
            exit 1
          fi
          if [[ -n "${FLAUZ_RELEASE_SIGNING_KEY_PASSPHRASE:-}" ]]; then
            gpg --homedir "${signing_home}" --batch --yes --quiet \
              --pinentry-mode loopback --passphrase-fd 3 \
              --local-user "${key_id}" --armor --detach-sign SHA256SUMS.txt \
              3<<< "${FLAUZ_RELEASE_SIGNING_KEY_PASSPHRASE}"
          else
            gpg --homedir "${signing_home}" --batch --yes --quiet \
              --local-user "${key_id}" --armor --detach-sign SHA256SUMS.txt
          fi
          if ! gpg --homedir "${signing_home}" --batch --quiet --verify SHA256SUMS.txt.asc SHA256SUMS.txt >/dev/null 2>&1; then
            echo "::error::[REL-001] the produced detached signature failed its round-trip verification — nothing is signed off from this step" >&2
            exit 1
          fi
          echo "[REL-001] SIGNATURE-PRODUCED: SHA256SUMS.txt.asc (signing key ${key_id}) — published with the release assets"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$(cat <<'EOF'
          ## Flauz.app — Codex Universal native desktop GUI

          Flauz.app is the Codex Universal desktop GUI on the codexRS
          native base: the full agent workspace plus the Universal
          workflow surface — teach (demonstrate / instruct / hybrid),
          compile, governed approve and publish, run, evidence with an
          environment timeline, immutable versions, fork and governed
          improvement — with no terminal fallback and no second engine.

          ### Runtime requirements

          Base surfaces work with the official Codex CLI (see
          `docs/platform-support.md` for the compatibility oracle). The
          Universal workflow surface requires a Codex Universal runtime
          that serves the `workflow/*` app-server family — today the
          `rust-v0.1.0` release of `payswapdotorg/codex`. With a runtime
          that does not serve the family, every workflow request fails
          closed with an actionable error and the rest of the app stays
          usable. The full policy is in
          `docs/codex-universal/RUNTIME-COMPATIBILITY.md`.

          ### Unsigned portable technical preview

          These Windows ZIP and Linux tar.gz assets are unsigned portable
          previews. Download only from this GitHub Release and verify the
          matching `SHA256SUMS.txt` entry before extraction. The checksum helps
          detect corruption after download; it is not an independent publisher
          signature.

          There is no installer, uninstaller, automatic desktop integration,
          URI handler, or automatic updater. On Linux,
          `codexrs --install-desktop-entry` explicitly creates a per-user
          desktop entry for the current extracted binary and never changes an
          existing entry. Extract into a directory you control. On
          Windows, keep `codexrs.exe` and `codex-computer-use-overlay.exe`
          together. Do not enable Computer Use from an archive whose source or
          checksum you do not trust.

          The Linux tar.gz is not a system package and does not install runtime
          dependencies. Ubuntu CI starts the extracted archive in an isolated
          Xvfb session; broader desktop-environment smoke coverage remains
          pending. Linux Computer Use
          provides only bounded, read-only screenshot observation of X11/XWayland
          windows when `DISPLAY` is nonempty. Text extraction, input, app launch,
          persistent approvals, the overlay, and interruption monitoring are
          unavailable; pure Wayland without XWayland is unsupported.
          EOF
          )"
          options=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Flauz.app ${GITHUB_REF_NAME}" \
            --notes "$notes" \
            --generate-notes \
            "${options[@]}"
